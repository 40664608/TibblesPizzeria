<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibbles Pizzeria</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="game-container">
    <h1>Tibbles Pizzeria</h1>

    <!-- Main Menu -->
    <div id="main-menu">
        <button id="new-game">New Game</button>
        <button id="continue">Continue</button>
        <button id="settings">Settings</button>
        <button id="exit">Exit</button>
    </div>

    <!-- Settings Menu (Initially Hidden) -->
    <div id="settings-menu" class="hidden">
        <h2>Settings</h2>
        <button id="language">Language</button>
        <button id="restart">Restart</button>
        <button id="back-to-main">Back to Main Menu</button>
    </div>

    <!-- Language Menu (Initially Hidden) -->
    <div id="language-menu" class="hidden">
        <h2>Language</h2>
        <button id="english">English</button>
        <button id="french">French</button>
        <button id="italian">Italian</button>
        <button id="spanish">Spanish</button>
        <button id="german">German</button>
        <button id="back-to-settings">Back to Settings</button>
    </div>

    <!-- Restart Confirmation (Initially Hidden) -->
    <div id="restart-confirm" class="hidden">
        <h2>Restart</h2>
        <p>Are you sure you want to restart?</p>
        <button id="confirm-restart">Yes</button>
        <button id="cancel-restart">No</button>
    </div>
</div>

<script src="js/menu.js"></script>
</body>
</html>
